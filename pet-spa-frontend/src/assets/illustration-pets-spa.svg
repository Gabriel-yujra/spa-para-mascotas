<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" fill="none">
  <!-- Fondo redondo -->
  <circle cx="200" cy="200" r="180" fill="#d6f3f7"/>
  <!-- Burbujas -->
  <circle cx="80"  cy="100" r="14" fill="#ffffff" opacity="0.85"/>
  <circle cx="320" cy="120" r="10" fill="#ffffff" opacity="0.85"/>
  <circle cx="60"  cy="260" r="8"  fill="#ffffff" opacity="0.7"/>
  <circle cx="340" cy="280" r="12" fill="#ffffff" opacity="0.85"/>
  <circle cx="280" cy="60"  r="7"  fill="#ffffff" opacity="0.7"/>

  <!-- Tina/spa -->
  <ellipse cx="200" cy="290" rx="160" ry="28" fill="#2bb6c4"/>
  <rect x="60" y="220" width="280" height="80" rx="40" fill="#fff"/>
  <rect x="60" y="220" width="280" height="14" rx="7" fill="#cce8eb"/>
  <!-- Espuma -->
  <circle cx="100" cy="220" r="22" fill="#ffffff"/>
  <circle cx="135" cy="208" r="18" fill="#ffffff"/>
  <circle cx="170" cy="216" r="20" fill="#ffffff"/>
  <circle cx="240" cy="212" r="22" fill="#ffffff"/>
  <circle cx="280" cy="220" r="18" fill="#ffffff"/>
  <circle cx="310" cy="214" r="16" fill="#ffffff"/>

  <!-- Perrito (izquierda) -->
  <g transform="translate(110,150)">
    <!-- Cuerpo -->
    <ellipse cx="0" cy="40" rx="44" ry="34" fill="#f5d4a0"/>
    <!-- Cabeza -->
    <circle cx="0" cy="0" r="34" fill="#f5d4a0"/>
    <!-- Orejas -->
    <ellipse cx="-26" cy="-8" rx="10" ry="20" fill="#c79867" transform="rotate(-20 -26 -8)"/>
    <ellipse cx="26"  cy="-8" rx="10" ry="20" fill="#c79867" transform="rotate(20 26 -8)"/>
    <!-- Ojos -->
    <ellipse cx="-10" cy="-2" rx="3" ry="4" fill="#2b2d42"/>
    <ellipse cx="10"  cy="-2" rx="3" ry="4" fill="#2b2d42"/>
    <!-- Mejillas -->
    <circle cx="-16" cy="10" r="4" fill="#ffb5c5" opacity="0.7"/>
    <circle cx="16"  cy="10" r="4" fill="#ffb5c5" opacity="0.7"/>
    <!-- Hocico -->
    <ellipse cx="0" cy="10" rx="9" ry="6" fill="#ffffff"/>
    <ellipse cx="0" cy="6"  rx="3" ry="2" fill="#2b2d42"/>
    <path d="M -3 12 Q 0 16 3 12" stroke="#2b2d42" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- Toallita en la cabeza -->
    <path d="M -34 -22 Q 0 -38 34 -22 L 30 -10 Q 0 -22 -30 -10 Z" fill="#2bb6c4"/>
  </g>

  <!-- Gatito (derecha) -->
  <g transform="translate(280,160)">
    <ellipse cx="0" cy="40" rx="40" ry="32" fill="#f6f6f6"/>
    <circle cx="0" cy="0" r="32" fill="#f6f6f6"/>
    <!-- Orejas triangulares -->
    <path d="M -28 -10 L -22 -34 L -10 -16 Z" fill="#f6f6f6"/>
    <path d="M  28 -10 L  22 -34 L  10 -16 Z" fill="#f6f6f6"/>
    <path d="M -25 -12 L -22 -26 L -14 -16 Z" fill="#ffb5c5"/>
    <path d="M  25 -12 L  22 -26 L  14 -16 Z" fill="#ffb5c5"/>
    <!-- Ojos cerrados (relajado) -->
    <path d="M -14 -2 Q -10 -6 -6 -2" stroke="#2b2d42" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M  6 -2 Q 10 -6 14 -2"   stroke="#2b2d42" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Bigotes -->
    <line x1="-22" y1="10" x2="-8" y2="9"  stroke="#2b2d42" stroke-width="1.2"/>
    <line x1="-22" y1="14" x2="-8" y2="13" stroke="#2b2d42" stroke-width="1.2"/>
    <line x1="22"  y1="10" x2="8"  y2="9"  stroke="#2b2d42" stroke-width="1.2"/>
    <line x1="22"  y1="14" x2="8"  y2="13" stroke="#2b2d42" stroke-width="1.2"/>
    <!-- Nariz y boca -->
    <path d="M -3 6 L 3 6 L 0 9 Z" fill="#ffb5c5"/>
    <path d="M 0 9 Q -3 12 -5 10"   stroke="#2b2d42" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M 0 9 Q  3 12  5 10"   stroke="#2b2d42" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <!-- Mejillas rosadas -->
    <circle cx="-18" cy="8" r="4" fill="#ffb5c5" opacity="0.7"/>
    <circle cx="18"  cy="8" r="4" fill="#ffb5c5" opacity="0.7"/>
  </g>

  <!-- Patitas/huellas decorativas -->
  <g opacity="0.6" fill="#ff8359">
    <circle cx="40"  cy="50" r="3"/>
    <circle cx="46"  cy="44" r="2.5"/>
    <circle cx="52"  cy="50" r="2.5"/>
    <circle cx="46"  cy="56" r="2.5"/>
    <ellipse cx="46" cy="62" rx="6" ry="4"/>
  </g>
  <g opacity="0.6" fill="#2bb6c4">
    <circle cx="350" cy="320" r="3"/>
    <circle cx="356" cy="314" r="2.5"/>
    <circle cx="362" cy="320" r="2.5"/>
    <circle cx="356" cy="326" r="2.5"/>
    <ellipse cx="356" cy="332" rx="6" ry="4"/>
  </g>
</svg>
